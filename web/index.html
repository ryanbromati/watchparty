<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchParty</title>
  </head>
  <body>
    <main id="stage">
      <video id="video" playsinline></video>
      <div id="login">
        <div id="brand">🔒 watchparty</div>
        <input
          id="pw"
          type="password"
          placeholder="Senha da sala"
          autocomplete="current-password"
        />
        <button id="enter">Entrar e assistir</button>
        <div id="error"></div>
      </div>
      <button id="resume" hidden>▶ Tocar com áudio</button>
      <div id="peers" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
